name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (lint, tests, shell integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build
      - name: Interactive tests
        run: python3 tests/eks_pty.py
      - name: Shell session tests (zsh, Bash, fish)
        run: python3 tests/session_pty.py
      - name: SSO sync tests
        run: python3 tests/sso_pty.py

  macos:
    name: macOS (tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace
