[package]
name = "awshop"
version = "0.1.0"
edition = "2021"
description = "An interactive AWS profile hopper"
license = "MIT"
repository = "https://github.com/olesku/awshop"

[workspace]
members = ["crates/awshop-plugin", "crates/awshop-eks", "crates/awshop-ssm"]
resolver = "2"

[[bin]]
name = "awshop"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
awshop-plugin = { path = "crates/awshop-plugin", version = "0.1.0" }
awshop-eks = { path = "crates/awshop-eks", version = "0.1.0" }
awshop-ssm = { path = "crates/awshop-ssm", version = "0.1.0" }
toml = { version = "0.8", default-features = false, features = ["parse"] }
sha1_smol = "1.0.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
percent-encoding = "2.3.2"

[dev-dependencies]
vt100 = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
